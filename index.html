<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" id="dynamic-favicon" href="/imagenes/logo/logo.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/imagenes/logo/logo.png" />
    
    <!-- iOS Safari / Pantalla de Inicio de iPhone -->
    <link rel="apple-touch-icon" sizes="180x180" id="dynamic-apple-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" id="dynamic-apple-title" content="Catálogo" />
    <meta name="theme-color" content="#09090b" />
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO & Social Media -->
    <title>Catálogo Digital | Pedidos Online</title>
    <meta name="description" id="dynamic-desc" content="Catálogo digital interactivo. Mirá nuestros productos y hacé tu pedido por WhatsApp de forma rápida y sencilla." />
    
    <!-- Open Graph / Facebook / WhatsApp Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" id="og-title" content="Catálogo Digital | Pedidos Online" />
    <meta property="og:description" id="og-desc" content="Mirá nuestro catálogo de productos y hacé tu pedido directamente por WhatsApp." />
    <meta property="og:image" id="og-image" content="/imagenes/logo/logo.svg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" id="twitter-title" content="Catálogo Digital | Pedidos Online" />
    <meta property="twitter:description" id="twitter-desc" content="Mirá nuestro catálogo de productos y hacé tu pedido directamente por WhatsApp." />
    <meta property="twitter:image" id="twitter-image" content="/imagenes/logo/logo.svg" />

    <!-- Fuente Outfit de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
